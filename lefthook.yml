pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,mjs,json,astro}"
      run: npx --no -- biome check --no-errors-on-unmatched {staged_files}
    - name: prettier
      glob: "*.{yml,yaml,md}"
      run: npx --no -- prettier --check {staged_files}
    - name: validate
      glob: "{presets/*.yml,config.yml}"
      run: npm run validate

pre-push:
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: test
      run: npm test
