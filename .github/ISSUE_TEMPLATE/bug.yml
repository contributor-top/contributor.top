name: Bug
description: Something on the site or in the data looks wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: Link the page and describe what you see and what you expected.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://contributor.top/…
