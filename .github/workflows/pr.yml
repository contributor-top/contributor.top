name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions: {}

jobs:
  # Squash merges use the PR title as the commit message, so it must follow Conventional Commits.
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - if: github.event_name == 'merge_group'
        run: echo "Checked when the pull request was opened."
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every change starts from an issue (Dependabot and release PRs are exempt).
  pr-meta:
    name: pr-meta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Description links an issue
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'release-please--')
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "::error::Add 'Closes #<issue>' to the pull request description."
            exit 1
          fi
      - if: github.event_name == 'merge_group'
        run: echo "Checked when the pull request was opened."
