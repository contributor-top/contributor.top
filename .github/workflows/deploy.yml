name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deployment at a time; a queued one is never cancelled, so the latest data always ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Country data lives in the `data` branch, written by the collector. Until it exists,
      # the site is built with real presets and no data, so every country shows "Collecting data…".
      - name: Look for the data branch
        id: data
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            mkdir .data
          fi
      - if: steps.data.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          DATA_DIR: .data
      - run: npm run privacy-check
        env:
          DATA_DIR: .data
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
