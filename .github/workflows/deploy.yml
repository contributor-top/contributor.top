name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    working-directory: site

# One deployment at a time; a queued one is never cancelled, so the latest data always ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      data_sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Country data lives in the `data` branch, written by the collector. Until it exists,
      # the site is built with real presets and no data, so every country shows "Collecting data…".
      - name: Look for the data branch
        id: data
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            mkdir ../.data
          fi
      - if: steps.data.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          persist-credentials: false
      # Every collector update makes a new snapshot commit: the deploy job uses it to name a deployment.
      - if: steps.data.outputs.exists == 'true'
        id: snapshot
        run: echo "sha=$(git -C ../.data rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          DATA_DIR: ../.data
      - run: npm run privacy-check
        env:
          DATA_DIR: ../.data
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
          # .well-known/security.txt: the action leaves out dot-directories by default.
          include-hidden-files: true

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: .
    steps:
      # The Pages API called directly instead of actions/deploy-pages. A deployment is named after a commit (Pages
      # rejects other names), and the action always takes the workflow's commit, so the collector's hourly deploys
      # reused one name: after a hang every one of them hung too, and after a success some were skipped. Here a push
      # deploys under its commit, and a collector deploy under the data snapshot that the collector has just pushed.
      # Runbook: docs/runbook.md, "A deploy hangs in syncing_files".
      - id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          DATA_SHA: ${{ needs.build.outputs.data_sha }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments"
          auth="Authorization: Bearer $GH_TOKEN"
          accept="Accept: application/vnd.github+json"
          # The commit goes second for a collector deploy, used only if Pages refuses the snapshot's name.
          names=("$GITHUB_SHA")
          if [ "$GITHUB_EVENT_NAME" != push ] && [ -n "$DATA_SHA" ] && [ "$DATA_SHA" != "$GITHUB_SHA" ]; then
            names=("$DATA_SHA" "$GITHUB_SHA")
          fi
          echo "Names in order: ${names[*]}"
          for name in "${names[@]}"; do
            oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
            echo "::add-mask::$oidc"
            body=$(jq -n --argjson id "$ARTIFACT_ID" --arg v "$name" --arg t "$oidc" '{artifact_id: $id, pages_build_version: $v, oidc_token: $t}')
            reply="$RUNNER_TEMP/created.json"
            code=$(curl -sS -o "$reply" -w "%{http_code}" -X POST -H "$auth" -H "$accept" -H "Content-Type: application/json" -d "$body" "$api") || code=000
            if [ "$code" != 200 ] && [ "$code" != 201 ]; then
              echo "::warning::Pages refused a deployment named $name (HTTP $code): $(head -c 300 "$reply" 2> /dev/null)"
              continue
            fi
            id=$(jq -r '.id // empty' "$reply")
            id=${id:-$name}
            page_url=$(jq -r '.page_url // empty' "$reply")
            echo "Created Pages deployment $id"
            status=""
            deadline=$((SECONDS + 600))
            while [ "$SECONDS" -lt "$deadline" ]; do
              sleep 15
              status=$(curl -fsS -H "$auth" -H "$accept" "$api/$id" | jq -r '.status // empty') || status=""
              echo "Status: ${status:-unknown}"
              case "$status" in
                succeed)
                  echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                deployment_failed | deployment_content_failed | deployment_cancelled | deployment_lost) break ;;
              esac
            done
            echo "::warning::Pages deployment $id did not finish (last status: ${status:-unknown}); cancelling it"
            curl -fsS -X POST -H "$auth" -H "$accept" "$api/$id/cancel" > /dev/null || true
            # Not the commit next: its name is used, and Pages may skip a used name while reporting success.
            break
          done
          echo "::error::Not deployed. The next commit or data snapshot deploys under a new name; see the runbook."
          exit 1
