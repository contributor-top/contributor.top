name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    working-directory: site

# One deployment at a time; a queued one is never cancelled, so the latest data always ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Country data lives in the `data` branch, written by the collector. Until it exists,
      # the site is built with real presets and no data, so every country shows "Collecting data…".
      - name: Look for the data branch
        id: data
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            mkdir ../.data
          fi
      - if: steps.data.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          DATA_DIR: ../.data
      - run: npm run privacy-check
        env:
          DATA_DIR: ../.data
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
          # .well-known/security.txt: the action leaves out dot-directories by default.
          include-hidden-files: true

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: .
    steps:
      # The Pages API called directly instead of actions/deploy-pages, which names every deployment after the commit
      # SHA: once a deployment hung in syncing_files, every retry of that commit hung too, until a new commit landed.
      # Here each attempt gets its own name (commit, run, run attempt, try), and a hung try is cancelled and made once
      # more under a new name. Runbook: docs/runbook.md, "A deploy hangs in syncing_files".
      - id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments"
          auth="Authorization: Bearer $GH_TOKEN"
          for try in 1 2; do
            version="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$try"
            oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
            echo "::add-mask::$oidc"
            body=$(jq -n --argjson id "$ARTIFACT_ID" --arg v "$version" --arg t "$oidc" '{artifact_id: $id, pages_build_version: $v, oidc_token: $t}')
            if ! created=$(curl -fsS -X POST -H "$auth" -H "Accept: application/vnd.github+json" -d "$body" "$api"); then
              echo "::warning::Could not create Pages deployment $version"
              continue
            fi
            id=$(jq -r '.id // empty' <<< "$created")
            id=${id:-$version}
            page_url=$(jq -r '.page_url // empty' <<< "$created")
            echo "Created Pages deployment $id"
            status=""
            deadline=$((SECONDS + 360))
            while [ "$SECONDS" -lt "$deadline" ]; do
              sleep 15
              status=$(curl -fsS -H "$auth" -H "Accept: application/vnd.github+json" "$api/$id" | jq -r '.status // empty') || status=""
              echo "Status: ${status:-unknown}"
              case "$status" in
                succeed)
                  echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                deployment_failed | deployment_content_failed | deployment_cancelled | deployment_lost) break ;;
              esac
            done
            echo "::warning::Pages deployment $id did not finish (last status: ${status:-unknown}); cancelling it"
            curl -fsS -X POST -H "$auth" -H "Accept: application/vnd.github+json" "$api/$id/cancel" > /dev/null || true
          done
          echo "::error::Both tries failed. A rerun or the next deploy starts under new names; see the runbook."
          exit 1
