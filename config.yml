# yaml-language-server: $schema=./site/src/schemas/config.schema.json
# Project settings. Changes go through a PR like any other change.

site:
  repo: contributor-top/contributor.top # GitHub owner/name shown in the source block

ranking:
  top_n: 512 # people shown per country and tab
  top_choices: [10, 50, 100, 256, 512] # sizes offered by the top selector
  default_top: 100 # size selected by default
  consider: 1000 # most-followed candidates examined per country
  world_top_n: 512
  private_flag_share: 0.95 # in "all contributions", warn when this share of contributions is private
  # In "all contributions", leave out people whose public contributions are less than this share of the total. Private
  # activity is one number GitHub gives without any detail, so it needs some public work to stand on. Measured Nov 2026
  # over the top 10 of 150 countries: 72 of the 1500 places had no public contributions at all and 462 had less than 1%,
  # among them accounts with one to three million private contributions a year.
  min_public_share: 0.01
  # Likely automated commits, for accounts with at least `min_commits` a year (left out of the world ranking and the
  # world badges, marked in country rankings):
  # - a commit farm: at least `ratio` times as many commits as pull requests, issues and reviews together;
  # - or one repository of their own, with fewer than `quiet_stars` stars, holds at least `quiet_share` of the commits
  #   (farms that also open pull requests hide from the ratio);
  # - but never when at least `popular_share` of the commits go to someone else's repository with `popular_stars` or
  #   more, or to any repository of an organization that has one (maintainers of big community projects who commit
  #   directly, such as FreeBSD ports or Liferay; Arch Linux packagers, whose release tool commits to a package
  #   record repository nobody stars).
  # The repository check is one extra request per account above `min_commits` (~150 a cycle); when it fails, only the
  # ratio applies. Measured Nov 2026 on the 374 accounts with 10k+ commits: the ratio alone flags 82, nearly all
  # farms; the repository check clears 4 maintainers and adds 4 one-repository farms. Counting the organization's
  # most starred repository clears 2 more of the 83 then marked (an Arch Linux packager, a company blog).
  automated:
    min_commits: 20000
    ratio: 50
    quiet_stars: 10
    quiet_share: 0.6
    popular_stars: 1000
    popular_share: 0.5

collector:
  batch_size: 10 # users per GraphQL request
  # Countries collected at once. Requests take 2–7 s of GitHub's server time; its secondary limit on CPU time,
  # not the points, caps this, so more than 2–3 only slows everything down.
  parallel_countries: 3
  pause_ms: 250 # pause between requests (reads only: a request itself takes 2–7 s)
  max_skipped_per_country: 5 # users that never load; above this the country is not updated
  budget_floor: 0.2 # a ceiling, not a target: below 20% of the hourly limit left, wait for the reset

# Measured (3 runs, Oct 2026, three workers): ~113 points and ~17 min per country on average, up to 35 min for the
# biggest; ~10 countries and ~1150 points per hour in total, about 23% of the limit: the secondary limit, not the
# points, sets the pace. A full cycle of 150 countries is ~15 h of runs, well within target_hours. While countries
# are due, each run starts the next one itself; once all are fresh, the hourly cron starts the next cycle. GitHub
# drops many scheduled runs (one every 4–11 h was seen), hence min_refresh_hours a few hours below target_hours.
freshness:
  target_hours: 48 # each country is refreshed about this often
  min_refresh_hours: 44 # never refresh a country more often than this; a run with nothing due ends right away
  max_run_minutes: 300 # one run; GitHub stops a job at 6 h. A country starts only if its last time (+50%) fits
  stale_days: 3 # a country older than this opens an alert issue (update.yml: freshness), closed when fresh again

circuit_breaker:
  max_candidate_drop: 0.5
  max_top_change: 0.6
  max_threshold_jump: 3

privacy:
  optout_phrase: "contributor.top opt-out"
  optin_phrase: "contributor.top opt-in"
  dropped_stub_days: 30

denylist_ids: [] # numeric GitHub IDs of bots or obvious gaming, added by PR only

reserved_slugs:
  - world
  - methodology
  - privacy
  - u
  - index
  - "404"
  - assets
  - api
  - stats
  - _astro
  - robots
  - sitemap
  - favicon
  - cname
  - well-known
